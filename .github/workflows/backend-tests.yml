name: Backend tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:backend
      - run: npx vitest run --config vitest.config.ts
      - run: npm run build:staging
        env:
          VITE_API_BASE_URL: https://api.singularitystream.org
